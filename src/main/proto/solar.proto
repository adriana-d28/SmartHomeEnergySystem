// Solar Panel Service
// Smart Home Energy Management System
// @author Adriana Dinelly - ID 25165771
// ----------------------------------------------------------------------------------------------
// This service is responsible only for providing information related to solar energy production.
//
// It exposes:
//   1. A Unary RPC to retrieve the current energy production.
//   2. A Server Streaming RPC to continuously monitor energy production updates.
//
// ----------------------------------------------------------------------------------------------

syntax = "proto3";

// Defines the package used inside the Protocol Buffers specification.
package solar;

// Defines the Java package where the generated Java classes will be created.
option java_package = "com.smarthome.solar";

// Generates multiple Java files instead of a single large file.
option java_multiple_files = true;

// Defines the name of the outer generated class.
option java_outer_classname = "SolarPanelProto";


// ============ Solar Panel Service Definition ============

service SolarPanelService {


// Unary RPC.
// The client sends one request containing the panel ID and receives one response from the server 
// with the current production.

  rpc GetCurrentProduction(GetCurrentProductionRequest) returns (ProductionInfo);

// Server Streaming RPC.
// The client sends one request to start monitoring.
// The server continuously sends updated production values until the client cancels the monitoring session.
 
  rpc MonitorProduction(MonitorProductionRequest) returns (stream ProductionInfo);

}

// ============ Request Messages ============


// Request used by the Unary RPC.
// The panelId uniquely identifies the solar panel whose production should be retrieved.

message GetCurrentProductionRequest {

  // Unique identifier of the solar panel.
  string panelId = 1;

}


// Request used by the Server Streaming RPC.
// Although it contains the same field as the Unary request, it is defined as a separate message 
// because it represents a different API operation.

message MonitorProductionRequest {

  // Unique identifier of the solar panel.
  string panelId = 1;

}

// ============ Response Messages ============


// Represents the current production information generated by a solar panel.
// This message is reused by both RPCs.

message ProductionInfo {

  // Unique identifier of the solar panel.
  string panelId = 1;

  // Current energy production.
  double currentProduction = 2;

  // Unit of measurement.
  string unit = 3;

  // Timestamp representing when the measurement was taken.
  string timestamp = 4;

}
